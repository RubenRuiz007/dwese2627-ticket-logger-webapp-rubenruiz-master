<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Ticket Logger - Home')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <!-- sortField y sortDir se sacan de sortParam ("campo,asc|desc") que envía el controller -->
    <div class="list-card"
         th:with="sortField=${sortParam != null ? #strings.substringBefore(sortParam, ',') : 'name'},
                   sortDir=${sortParam != null ? #strings.substringAfter(sortParam, ',') : 'asc'}">

        <!-- Título listado -->
        <h1 th:text="#{msg.province-list.title}"></h1>

        <!-- Botón para añadir nueva provincia -->
        <a th:href="@{/provinces/new}"
           class="btn btn-success"
           th:text="#{msg.province-list.add}"></a>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}"
             class="alert alert-danger mt-3"
             th:text="${errorMessage}"></div>

        <!-- Tabla de provincias -->
        <table class="table table-bordered table-striped mt-3" th:if="${page != null}">
            <thead>
            <tr>
                <!-- ID -->
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(
                page=${page.number},
                size=${page.size},
                sort=${(sortField == 'id' and sortDir == 'asc') ? 'id,desc' : 'id,asc'}
           )}">
                        <span th:text="#{msg.province-list.id}"></span>
                        <span class="ms-1" th:if="${sortField == 'id'}"
                              th:text="${sortDir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>

                <!-- Código -->
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(
                page=${page.number},
                size=${page.size},
                sort=${(sortField == 'code' and sortDir == 'asc') ? 'code,desc' : 'code,asc'}
           )}">
                        <span th:text="#{msg.province-list.code}"></span>
                        <span class="ms-1" th:if="${sortField == 'code'}"
                              th:text="${sortDir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>

                <!-- Nombre provincia -->
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(
                page=${page.number},
                size=${page.size},
                sort=${(sortField == 'name' and sortDir == 'asc') ? 'name,desc' : 'name,asc'}
           )}">
                        <span th:text="#{msg.province-list.name}"></span>
                        <span class="ms-1" th:if="${sortField == 'name'}"
                              th:text="${sortDir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>

                <!-- Región (region.name) -->
                <th>
                    <a class="text-decoration-none"
                       th:href="@{/provinces(
                page=${page.number},
                size=${page.size},
                sort=${(sortField == 'region.name' and sortDir == 'asc') ? 'region.name,desc' : 'region.name,asc'}
           )}">
                        <span th:text="#{msg.province-list.region}"></span>
                        <span class="ms-1" th:if="${sortField == 'region.name'}"
                              th:text="${sortDir == 'asc'} ? '▲' : '▼'"></span>
                    </a>
                </th>

                <th th:text="#{msg.province-list.actions}"></th>
            </tr>
            </thead>
            <tbody th:each="province:${page.content}">
            <tr>
                <td th:text="${province.id}"></td>
                <td th:text="${province.code}"></td>
                <td th:text="${province.name}"></td>
                <!-- Nombre de la Comunidad Autónoma asociada -->
                <td th:text="${province.regionName}"></td>
                <td><a th:href="@{/provinces/detail(id=${province.id})}" class="btn btn-outline-secondary btn-sm me-1"
                       th:text = "#{msg.province-list.viewDetail}"></a>
                    <!-- Editar -->
                    <a th:href="@{/provinces/edit(id=${province.id})}"
                       class="btn btn-primary btn-sm"
                       th:text="#{msg.province-list.edit}"></a>

                    <!-- Eliminar -->
                    <form th:action="@{/provinces/delete}" method="post" class="d-inline">
                        <input type="hidden" name="id" th:value="${province.id}"/>
                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                th:text="#{msg.province-list.delete}"
                                th:onclick="|return confirm('#{msg.province-list.confirm}');|"></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <!-- Paginación -->
        <div class="d-flex justify-content-between align-items-center mt-3"
             th:if="${page != null and page.totalPages > 0}">


            <!-- Info de página -->
            <div>
                <!-- "Página X de Y (N registros en total)" -->
                <span th:text="#{msg.pagination.info(${page.number} + 1, ${page.totalPages}, ${page.totalElements})}"></span>
            </div>


            <!-- Controles de paginación -->
            <nav th:aria-label="#{msg.pagination.aria.label}">
                <ul class="pagination mb-0">


                    <!-- Botón Anterior -->
                    <li class="page-item"
                        th:classappend="${page.first} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/provinces(page=${page.number - 1}, size=${page.size}, sort=${sortParam})}"
                           th:aria-label="#{msg.pagination.prev}">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <!-- Números de página -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                        th:classappend="${i == page.number} ? ' active'">
                        <a class="page-link"
                           th:text="${i + 1}"
                           th:href="@{/provinces(page=${i}, size=${page.size}, sort=${sortParam})}"></a>
                    </li>

                    <!-- Botón Siguiente -->
                    <li class="page-item"
                        th:classappend="${page.last} ? ' disabled'">
                        <a class="page-link"
                           th:href="@{/provinces(page=${page.number + 1}, size=${page.size}, sort=${sortParam})}"
                           th:aria-label="#{msg.pagination.next}">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
        <!-- Volver -->
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.province-form.returnback}"></a>

    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
